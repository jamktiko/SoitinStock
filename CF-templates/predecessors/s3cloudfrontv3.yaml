AWSTemplateFormatVersion: '2010-09-09'
Description: 'SoitinStock - Frontend (S3 + CloudFront Hardened)'

Resources:
    # --------------------------------------------------------------------
    # S3 Bucket (PRIVATE)
    # --------------------------------------------------------------------
    FrontendBucket:
        Type: AWS::S3::Bucket
        Properties:
            BucketName: !Sub 'soitinstock-frontend-${AWS::AccountId}'

            VersioningConfiguration:
                Status: Enabled

            PublicAccessBlockConfiguration:
                BlockPublicAcls: true
                BlockPublicPolicy: true
                IgnorePublicAcls: true
                RestrictPublicBuckets: true

    # --------------------------------------------------------------------
    # CloudFront Origin Access Control
    # --------------------------------------------------------------------
    FrontendOAC:
        Type: AWS::CloudFront::OriginAccessControl
        Properties:
            OriginAccessControlConfig:
                Name: SoitinStock-OAC
                OriginAccessControlOriginType: s3
                SigningBehavior: always
                SigningProtocol: sigv4

    # --------------------------------------------------------------------
    # CloudFront Distribution
    # --------------------------------------------------------------------
    FrontendDistribution:
        Type: AWS::CloudFront::Distribution
        Properties:
            DistributionConfig:
                Enabled: true
                DefaultRootObject: index.html
                PriceClass: PriceClass_100

                Origins:
                    # ========================================================
                    # Frontend Origin (Private S3)
                    # ========================================================
                    - Id: S3Origin
                      DomainName: !GetAtt FrontendBucket.RegionalDomainName
                      OriginAccessControlId: !Ref FrontendOAC
                      S3OriginConfig: {}

                    # ========================================================
                    # Backend API Origin (Elastic Beanstalk ALB)
                    # ========================================================
                    - Id: ApiOrigin
                      DomainName:
                          Fn::ImportValue: SoitinStock-EnvironmentURL

                      CustomOriginConfig:
                          HTTPPort: 80
                          HTTPSPort: 443

                          # Internal AWS traffic only
                          # HTTPS already enforced at CloudFront edge
                          OriginProtocolPolicy: http-only

                # ----------------------------------------------------------------
                # API ROUTING
                # ----------------------------------------------------------------
                CacheBehaviors:
                    - PathPattern: /api/*

                      TargetOriginId: ApiOrigin

                      # Force HTTPS for users
                      ViewerProtocolPolicy: redirect-to-https

                      AllowedMethods:
                          - GET
                          - HEAD
                          - OPTIONS
                          - PUT
                          - POST
                          - PATCH
                          - DELETE

                      CachedMethods:
                          - GET
                          - HEAD

                      ForwardedValues:
                          QueryString: true

                          Headers:
                              - Authorization

                          Cookies:
                              Forward: all

                # ----------------------------------------------------------------
                # DEFAULT FRONTEND ROUTING
                # ----------------------------------------------------------------
                DefaultCacheBehavior:
                    TargetOriginId: S3Origin

                    # Force HTTPS for frontend
                    ViewerProtocolPolicy: redirect-to-https

                    AllowedMethods:
                        - GET
                        - HEAD

                    CachedMethods:
                        - GET
                        - HEAD

                    ForwardedValues:
                        QueryString: false

                        Cookies:
                            Forward: none

                # ----------------------------------------------------------------
                # SPA ROUTING SUPPORT
                # ----------------------------------------------------------------
                CustomErrorResponses:
                    - ErrorCode: 403
                      ResponseCode: 200
                      ResponsePagePath: /index.html

                    - ErrorCode: 404
                      ResponseCode: 200
                      ResponsePagePath: /index.html

    # --------------------------------------------------------------------
    # Bucket Policy (CloudFront Only)
    # --------------------------------------------------------------------
    FrontendBucketPolicy:
        Type: AWS::S3::BucketPolicy
        Properties:
            Bucket: !Ref FrontendBucket

            PolicyDocument:
                Version: '2012-10-17'

                Statement:
                    - Effect: Allow

                      Principal:
                          Service: cloudfront.amazonaws.com

                      Action: s3:GetObject

                      Resource: !Sub '${FrontendBucket.Arn}/*'

                      Condition:
                          StringEquals:
                              AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'

Outputs:
    CloudFrontURL:
        Description: 'Frontend URL'
        Value: !Sub 'https://${FrontendDistribution.DomainName}'

    BucketName:
        Description: 'Frontend S3 bucket'
        Value: !Ref FrontendBucket
