<table>
  <thead>
    <tr>
      <th>Customer</th>
      <th>Start Date</th>
      <th>End Date</th>
      <th>Status</th>
      <!-- <th>Instrument</th> -->
    </tr>
  </thead>
  <tbody>
    @for (rental of rentals; track rental.id) {
      <tr>
        <td>{{ rental.firstname + ' ' + rental.lastname }}</td>
        <td>{{ rental.start_date }}</td>
        <td>{{ rental.end_date }}</td>
        <td>{{ rental.rent_status }}</td>
        <!-- <td>{{ rental.instrument }}</td> -->
      </tr>
    }
  </tbody>
</table>
