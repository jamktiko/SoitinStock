<div>
  @if (pstore.isLoading()) {
    <p>Loading instruments...</p>
  } @else {
    @for (instrument of instruments(); track instrument.id_Instrument) {
      <p>{{ instrument.name }}</p>
      <p>Model: {{ instrument.model }}</p>
      <p>Description: {{ instrument.Description }}</p>
      <button (click)="showModal()">Show Description</button>
      @if (modal()) {
        <p>modal works</p>
      }
    }
  }
</div>
