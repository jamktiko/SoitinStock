<div class="login-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Login</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <p>Please log in with Cognito to access the application.</p>

      <button mat-raised-button color="primary" (click)="login()">Login with Cognito</button>

      <button (click)="callApi()">Call Protected Backend</button>
      <pre>{{ output }}</pre>
      <button (click)="forceLogin()">Fake login</button>
    </mat-card-content>
  </mat-card>
</div>
