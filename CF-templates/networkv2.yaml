AWSTemplateFormatVersion: '2010-09-09'
Description: 'SoitinStock - Network Stack (Minimal Hardening Update)'

Parameters:
    VPCId:
        Type: AWS::EC2::VPC::Id
        Description: Default VPC ID

Resources:
    # --------------------------------------------------------------------
    # Private Subnet A (AZ 1)
    # --------------------------------------------------------------------
    PrivateSubnetA:
        Type: AWS::EC2::Subnet
        Properties:
            VpcId: !Ref VPCId
            AvailabilityZone: !Select [0, !GetAZs '']
            CidrBlock: 172.31.64.0/20
            MapPublicIpOnLaunch: false

            Tags:
                - Key: Name
                  Value: SoitinStock-Private-A

    # --------------------------------------------------------------------
    # Private Subnet B (AZ 2)
    # --------------------------------------------------------------------
    PrivateSubnetB:
        Type: AWS::EC2::Subnet
        Properties:
            VpcId: !Ref VPCId
            AvailabilityZone: !Select [1, !GetAZs '']
            CidrBlock: 172.31.80.0/20
            MapPublicIpOnLaunch: false

            Tags:
                - Key: Name
                  Value: SoitinStock-Private-B

    # --------------------------------------------------------------------
    # Isolated Route Table (NO INTERNET ACCESS)
    # --------------------------------------------------------------------
    PrivateRouteTable:
        Type: AWS::EC2::RouteTable
        Properties:
            VpcId: !Ref VPCId

            Tags:
                - Key: Name
                  Value: SoitinStock-Private-RT

    # --------------------------------------------------------------------
    # Associate Private Subnet A
    # --------------------------------------------------------------------
    PrivateSubnetARouteAssociation:
        Type: AWS::EC2::SubnetRouteTableAssociation
        Properties:
            SubnetId: !Ref PrivateSubnetA
            RouteTableId: !Ref PrivateRouteTable

    # --------------------------------------------------------------------
    # Associate Private Subnet B
    # --------------------------------------------------------------------
    PrivateSubnetBRouteAssociation:
        Type: AWS::EC2::SubnetRouteTableAssociation
        Properties:
            SubnetId: !Ref PrivateSubnetB
            RouteTableId: !Ref PrivateRouteTable
    # --------------------------------------------------------------------
    # DB Subnet Group
    # --------------------------------------------------------------------
    DBSubnetGroup:
        Type: AWS::RDS::DBSubnetGroup
        Properties:
            DBSubnetGroupDescription: 'SoitinStock RDS subnet group'

            SubnetIds:
                - !Ref PrivateSubnetA
                - !Ref PrivateSubnetB

            DBSubnetGroupName: soitinstock-db-subnet-group

            Tags:
                - Key: Name
                  Value: SoitinStock-DBSubnetGroup

    # --------------------------------------------------------------------
    # ALB Security Group
    # --------------------------------------------------------------------
    ALBSecurityGroup:
        Type: AWS::EC2::SecurityGroup
        Properties:
            GroupDescription: 'Application Load Balancer security group'
            VpcId: !Ref VPCId

            SecurityGroupIngress:
                # Public HTTP
                - IpProtocol: tcp
                  FromPort: 80
                  ToPort: 80
                  CidrIp: 0.0.0.0/0

                # Public HTTPS
                - IpProtocol: tcp
                  FromPort: 443
                  ToPort: 443
                  CidrIp: 0.0.0.0/0

            Tags:
                - Key: Name
                  Value: SoitinStock-ALB-SG

    # --------------------------------------------------------------------
    # Elastic Beanstalk Security Group
    # --------------------------------------------------------------------
    EBSecurityGroup:
        Type: AWS::EC2::SecurityGroup
        Properties:
            GroupDescription: 'Elastic Beanstalk EC2 instances security group'
            VpcId: !Ref VPCId

            SecurityGroupIngress:
                # HTTP ONLY from ALB
                - IpProtocol: tcp
                  FromPort: 80
                  ToPort: 80
                  SourceSecurityGroupId: !Ref ALBSecurityGroup

                # HTTPS ONLY from ALB
                - IpProtocol: tcp
                  FromPort: 443
                  ToPort: 443
                  SourceSecurityGroupId: !Ref ALBSecurityGroup

                # SSH access for administration
                - IpProtocol: tcp
                  FromPort: 22
                  ToPort: 22
                  CidrIp: 195.148.39.81/32

            Tags:
                - Key: Name
                  Value: SoitinStock-EB-SG

Outputs:
    PrivateSubnetAId:
        Value: !Ref PrivateSubnetA
        Export:
            Name: SoitinStock-PrivateSubnetA

    PrivateSubnetBId:
        Value: !Ref PrivateSubnetB
        Export:
            Name: SoitinStock-PrivateSubnetB

    DBSubnetGroupName:
        Value: !Ref DBSubnetGroup
        Export:
            Name: SoitinStock-DBSubnetGroup

    ALBSecurityGroupId:
        Value: !Ref ALBSecurityGroup
        Export:
            Name: SoitinStock-ALBSecurityGroup

    EBSecurityGroup:
        Value: !Ref EBSecurityGroup
        Export:
            Name: SoitinStock-EBSecurityGroup
