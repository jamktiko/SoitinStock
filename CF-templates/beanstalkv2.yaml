AWSTemplateFormatVersion: '2010-09-09'
Description: 'SoitinStock - Elastic Beanstalk Layer 1 (Load Balanced Hardened)'

Parameters:
    ApplicationName:
        Type: String
        Default: SoitinStock

    EnvironmentName:
        Type: String
        Default: SoitinStock-env

    InstanceType:
        Type: String
        Default: t4g.small

    KeyPairName:
        Type: String
        Default: vockey

    VPCId:
        Type: AWS::EC2::VPC::Id
        Description: Default VPC ID

    SubnetId:
        Type: AWS::EC2::Subnet::Id
        Description: Public subnet for Elastic Beanstalk instances

    DBPassword:
        Type: String
        NoEcho: true
        Description: 'Database password'

Resources:
    # --------------------------------------------------------------------
    # Elastic Beanstalk Application
    # --------------------------------------------------------------------
    EBApplication:
        Type: AWS::ElasticBeanstalk::Application
        Properties:
            ApplicationName: !Ref ApplicationName

    # --------------------------------------------------------------------
    # Elastic Beanstalk Environment
    # --------------------------------------------------------------------
    EBEnvironment:
        Type: AWS::ElasticBeanstalk::Environment
        Properties:
            ApplicationName: !Ref EBApplication
            EnvironmentName: !Ref EnvironmentName

            SolutionStackName: '64bit Amazon Linux 2023 v6.10.1 running Node.js 24'

            OptionSettings:
                # ============================================================
                # Environment Type
                # ============================================================
                - Namespace: aws:elasticbeanstalk:environment
                  OptionName: EnvironmentType
                  Value: LoadBalanced

                - Namespace: aws:elasticbeanstalk:environment
                  OptionName: ServiceRole
                  Value: !ImportValue SoitinStock-ServiceRoleArn

                # ============================================================
                # EC2 Instance Configuration
                # ============================================================
                - Namespace: aws:autoscaling:launchconfiguration
                  OptionName: InstanceType
                  Value: !Ref InstanceType

                - Namespace: aws:autoscaling:launchconfiguration
                  OptionName: IamInstanceProfile
                  Value: !ImportValue SoitinStock-InstanceProfileName

                - Namespace: aws:autoscaling:launchconfiguration
                  OptionName: EC2KeyName
                  Value: !Ref KeyPairName

                - Namespace: aws:autoscaling:launchconfiguration
                  OptionName: DisableIMDSv1
                  Value: 'true'

                # Use hardened EB security group
                - Namespace: aws:autoscaling:launchconfiguration
                  OptionName: SecurityGroups
                  Value:
                      Fn::ImportValue: SoitinStock-EBSecurityGroup

                # ============================================================
                # Load Balancer Configuration
                # ============================================================
                - Namespace: aws:elbv2:loadbalancer
                  OptionName: SecurityGroups
                  Value:
                      Fn::ImportValue: SoitinStock-ALBSecurityGroup

                - Namespace: aws:elbv2:listener:default
                  OptionName: ListenerEnabled
                  Value: 'true'

                # ============================================================
                # Capacity
                # ============================================================
                - Namespace: aws:autoscaling:asg
                  OptionName: MinSize
                  Value: '1'

                - Namespace: aws:autoscaling:asg
                  OptionName: MaxSize
                  Value: '1'

                # ============================================================
                # VPC Configuration
                # ============================================================
                - Namespace: aws:ec2:vpc
                  OptionName: VPCId
                  Value: !Ref VPCId

                # EC2 instances
                - Namespace: aws:ec2:vpc
                  OptionName: Subnets
                  Value: !Ref SubnetId

                # ALB subnets
                - Namespace: aws:ec2:vpc
                  OptionName: ELBSubnets
                  Value: !Ref SubnetId

                # Internet-facing ALB
                - Namespace: aws:ec2:vpc
                  OptionName: ELBScheme
                  Value: public

                # EC2 still receives public IP
                # safer migration path for existing environment
                - Namespace: aws:ec2:vpc
                  OptionName: AssociatePublicIpAddress
                  Value: 'true'

                # ============================================================
                # Application Proxy
                # ============================================================
                - Namespace: aws:elasticbeanstalk:environment:proxy
                  OptionName: ProxyServer
                  Value: nginx

                # ============================================================
                # Health / Monitoring
                # ============================================================
                - Namespace: aws:elasticbeanstalk:cloudwatch:logs
                  OptionName: StreamLogs
                  Value: 'true'

                - Namespace: aws:elasticbeanstalk:cloudwatch:logs
                  OptionName: RetentionInDays
                  Value: '7'

                # Healthcheck configuration add later. (?)
                # - Namespace: aws:elasticbeanstalk:application
                #   OptionName: Application Healthcheck URL
                #   Value: /health

                # ============================================================
                # Deployment Strategy
                # ============================================================
                - Namespace: aws:elasticbeanstalk:command
                  OptionName: DeploymentPolicy
                  Value: AllAtOnce

                - Namespace: aws:elasticbeanstalk:command
                  OptionName: Timeout
                  Value: '600'

                # ============================================================
                # Environment Variables
                # ============================================================
                - Namespace: aws:elasticbeanstalk:application:environment
                  OptionName: NODE_ENV
                  Value: production

                - Namespace: aws:elasticbeanstalk:application:environment
                  OptionName: COGNITO_USER_POOL_ID
                  Value:
                      Fn::ImportValue: SoitinStock-UserPoolId

                - Namespace: aws:elasticbeanstalk:application:environment
                  OptionName: COGNITO_CLIENT_ID
                  Value:
                      Fn::ImportValue: SoitinStock-UserPoolClientId

                - Namespace: aws:elasticbeanstalk:application:environment
                  OptionName: RDS_HOST
                  Value:
                      Fn::ImportValue: SoitinStock-RDSEndpoint

                - Namespace: aws:elasticbeanstalk:application:environment
                  OptionName: RDS_PORT
                  Value:
                      Fn::ImportValue: SoitinStock-RDSPort

                - Namespace: aws:elasticbeanstalk:application:environment
                  OptionName: RDS_DB_NAME
                  Value:
                      Fn::ImportValue: SoitinStock-DBName

                - Namespace: aws:elasticbeanstalk:application:environment
                  OptionName: RDS_USERNAME
                  Value:
                      Fn::ImportValue: SoitinStock-DBUser

                - Namespace: aws:elasticbeanstalk:application:environment
                  OptionName: RDS_PASSWORD
                  Value: !Ref DBPassword

Outputs:
    EnvironmentURL:
        Description: 'Elastic Beanstalk environment URL'
        Value: !GetAtt EBEnvironment.EndpointURL
        Export:
            Name: SoitinStock-EnvironmentURL
